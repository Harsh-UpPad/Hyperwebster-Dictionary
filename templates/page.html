<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyperwebster Variations</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 650px;
            margin: 30px auto;
            padding: 20px;
            text-align: center;
            background-color: #f4f4f9;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .nav-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .back-link {
            text-decoration: none;
            color: #0070f3;
            font-weight: bold;
        }
        .results-box {
            max-height: 450px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 4px;
            text-align: left;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 10px 14px;
            border-bottom: 1px solid #eee;
        }
        th {
            background-color: #f8f9fa;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .pagination-controls {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }
        .btn-nav {
            background-color: #eaeaea;
            color: #333;
            padding: 8px 16px;
            text-decoration: none;
            border-radius: 4px;
            font-size: 14px;
        }
        .btn-nav:hover {
            background-color: #dcdcdc;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="nav-header">
            <a href="/" class="back-link">← New Search</a>
            <h2 id="viewingTitle">Variations Matrix</h2>
            <div style="width: 80px;"></div>
        </div>

        <div class="results-box">
            <table>
                <thead>
                    <tr>
                        <th>Offset Layer</th>
                        <th>Hyperwebster Result Variation</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr>
                        <td colspan="2" style="text-align:center;">Analyzing variations data...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="pagination-controls">
            <a id="prevBtn" href="#" class="btn-nav">← Previous Variations</a>
            <a id="nextBtn" href="#" class="btn-nav">Next Variations →</a>
        </div>
    </div>

    <script>
        async function loadPageData() {
            const urlParams = new URLSearchParams(window.location.search);
            const searchVal = urlParams.get('search') || '';
            const indexVal = urlParams.get('searchIndex') || '';
            const prefixVal = urlParams.get('prefix') || '';

            // Construct precise variation endpoints
            let apiTarget = '/api/simple-search';
            if (searchVal) {
                apiTarget += `?search=${encodeURIComponent(searchVal)}`;
            } else if (indexVal) {
                apiTarget += `?searchIndex=${encodeURIComponent(indexVal)}&prefix=${encodeURIComponent(prefixVal)}`;
            } else {
                return;
            }

            try {
                const response = await fetch(apiTarget);
                const data = await response.json();

                if (!response.ok) {
                    document.getElementById('tableBody').innerHTML = `<tr><td colspan="2" style="color:red; text-align:center;">${data.message}</td></tr>`;
                    return;
                }

                document.getElementById('viewingTitle').textContent = `"${data.prefix}" Branch Matrix`;

                let rowsHtml = '';
                data.words.forEach(item => {
                    rowsHtml += `
                        <tr>
                            <td><code>+${item.offset}</code></td>
                            <td><strong>${item.word}</strong></td>
                        </tr>
                    `;
                });
                document.getElementById('tableBody').innerHTML = rowsHtml;

                const currentOffset = parseInt(data.current_offset);
                const prevOffset = Math.max(0, currentOffset - 50);
                const nextOffset = currentOffset + 50;

                // Lock operational states using state context parameters
                document.getElementById('prevBtn').href = `/view?searchIndex=${prevOffset}&prefix=${encodeURIComponent(data.prefix)}`;
                document.getElementById('nextBtn').href = `/view?searchIndex=${nextOffset}&prefix=${encodeURIComponent(data.prefix)}`;

                if (currentOffset <= 0) {
                    document.getElementById('prevBtn').style.pointerEvents = 'none';
                    document.getElementById('prevBtn').style.opacity = '0.5';
                }

            } catch (error) {
                console.error(error);
                document.getElementById('tableBody').innerHTML = `<tr><td colspan="2" style="color:orange; text-align:center;">Error matching system variants.</td></tr>`;
            }
        }

        window.addEventListener('DOMContentLoaded', loadPageData);
    </script>
</body>
</html>
