<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyperwebster Page Viewer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 650px;
            margin: 30px auto;
            padding: 20px;
            text-align: center;
            background-color: #f4f4f9;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .nav-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .back-link {
            text-decoration: none;
            color: #0070f3;
            font-weight: bold;
        }
        .results-box {
            max-height: 450px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 4px;
            text-align: left;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 10px 14px;
            border-bottom: 1px solid #eee;
            white-space: nowrap;
        }
        th {
            background-color: #f8f9fa;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .pagination-controls {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }
        .btn-nav {
            background-color: #eaeaea;
            color: #333;
            padding: 8px 16px;
            text-decoration: none;
            border-radius: 4px;
            font-size: 14px;
        }
        .btn-nav:hover {
            background-color: #dcdcdc;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="nav-header">
            <a href="/" class="back-link">← Main Search</a>
            <h2 id="viewingTitle">Viewing 50 Rows</h2>
            <div style="width: 80px;"></div>
        </div>

        <div class="results-box">
            <table>
                <thead>
                    <tr>
                        <th>Base-10 Index Coordinate</th>
                        <th>Sequence</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr>
                        <td colspan="2" style="text-align:center;">Loading index data...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="pagination-controls">
            <a id="prevBtn" href="#" class="btn-nav">← Previous 50</a>
            <a id="nextBtn" href="#" class="btn-nav">Next 50 →</a>
        </div>
    </div>

    <script>
        async function loadPageData() {
            const urlParams = new URLSearchParams(window.location.search);
            const searchVal = urlParams.get('search') || '';
            const modeVal = urlParams.get('mode') || 'str';

            let apiTarget = `/api/simple-search?search=${encodeURIComponent(searchVal)}&mode=${encodeURIComponent(modeVal)}`;

            try {
                const response = await fetch(apiTarget);
                const data = await response.json();

                if (!response.ok) {
                    document.getElementById('tableBody').innerHTML = `<tr><td colspan="2" style="color:red; text-align:center;">${data.message}</td></tr>`;
                    return;
                }

                document.getElementById('viewingTitle').textContent = `Search Mode: ${data.mode.toUpperCase()}`;

                let rowsHtml = '';
                data.words.forEach(item => {
                    // Truncate overly long index strings visually on-screen for clean tables
                    let displayIdx = item.index.length > 25 ? item.index.substring(0,22) + "..." : item.index;
                    rowsHtml += `
                        <tr>
                            <td title="${item.index}"><code>#${displayIdx}</code></td>
                            <td><strong>${item.word}</strong></td>
                        </tr>
                    `;
                });
                document.getElementById('tableBody').innerHTML = rowsHtml;

                // Handle pagination using big-integers as standard base-10 indices
                const currentStart = BigInt(data.start_index);
                const prevStart = currentStart - 50n < 1n ? 1n : currentStart - 50n;
                const nextStart = currentStart + 50n;

                // Pass the next index coordinates via mode="idx" to handle the direct number sequence pagination
                document.getElementById('prevBtn').href = `/view?search=${prevStart.toString()}&mode=idx`;
                document.getElementById('nextBtn').href = `/view?search=${nextStart.toString()}&mode=idx`;

                if (currentStart <= 1n) {
                    document.getElementById('prevBtn').style.pointerEvents = 'none';
                    document.getElementById('prevBtn').style.opacity = '0.5';
                }

            } catch (error) {
                console.error(error);
                document.getElementById('tableBody').innerHTML = `<tr><td colspan="2" style="color:orange; text-align:center;">Error communicating with Flask backend.</td></tr>`;
            }
        }

        window.addEventListener('DOMContentLoaded', loadPageData);
    </script>
</body>
</html>
