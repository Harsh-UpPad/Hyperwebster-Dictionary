<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>On The Cloud's Projects</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 100px auto;
            padding: 20px;
            text-align: center;
            background-color: #f4f4f9;
        }
        .container {
            background: white;
            padding: 40px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        button {
            background-color: #0070f3;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 15px;
            width: 100%;
        }
        button:hover {
            background-color: #0051cb;
        }
        input {
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 100%;
            box-sizing: border-box;
            font-size: 16px;
        }
        .divider {
            margin: 15px 0;
            font-weight: bold;
            color: #666;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Welcome to the Hyperwebster!</h1>
        <p>Explore the endless boundaries of every printable sequence in Base-94.</p>
        
        <!-- Standard HTML submission that navigates the browser directly to the layout page -->
        <form action="/view" method="get">
            <input name="search" type="text" placeholder="Search a word or phrase...">
            <div class="divider">or</div>
            <input name="searchIndex" type="number" placeholder="Jump directly to Index #">
            <button type="submit">Open Hyperwebster Page</button>
        </form>
    </div>

</body>
</html>
