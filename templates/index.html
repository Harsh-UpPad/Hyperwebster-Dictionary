<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>On The Cloud's Projects</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 100px auto;
            padding: 20px;
            text-align: center;
            background-color: #f4f4f9;
        }
        .container {
            background: white;
            padding: 40px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        button {
            background-color: #0070f3;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 15px;
            width: 100%;
        }
        button:hover {
            background-color: #0051cb;
        }
        input, select {
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 100%;
            box-sizing: border-box;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Welcome to the Hyperwebster!</h1>
        <p>Explore the endless boundaries of every printable sequence in Base-94.</p>
        
        <form action="/view" method="get">
            <label for="searchMode" style="display:block; text-align:left; font-size:14px; font-weight:bold; margin-bottom:2px;">Search Mode:</label>
            <select id="searchMode" name="mode">
                <option value="str">Plain Text (Base-94 Word String)</option>
                <option value="idx">Standard Number Index (Base-10)</option>
                <option value="hex">Hexadecimal Index (Base-16)</option>
                <option value="b36">Alphanumeric Index (Base-36)</option>
            </select>
            
            <input name="search" type="text" placeholder="Enter search value..." required>
            <button type="submit">Open Hyperwebster Page</button>
        </form>
    </div>

</body>
</html>
